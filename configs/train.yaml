data_dir: "data/VOC2012_train_val/VOC2012_train_val"
# Supported backbones (see src/models.py: Backbone.backboneModel):
#   - "vgg16"
#   - "vgg19"
#   - "resnet50"
#   - "resnet101"
#   - "densenet121"
#   - "mobilenetV2"
backbone_arch: "resnet101"

dropout_rate: 0.35
learning_rate: 0.0001
test_size: 0.1

image_size: 64
batch_size: 256
epochs: 100

# Fraction of total epochs used to fine-tune the backbone at the end of training
backbone_train_fraction: 0.1

optimizer: "Adam"
loss: "categorical_crossentropy"
metrics:
  - "accuracy"

# Cache / dataset processing defaults used by train.py
cache_dir: "data/processed"
workers: 8
cache_name: "preprocessed"
chunk_size: 100  # images; higher uses more memory

# Logging defaults
logdir: "logs"

early_stopping:
  enabled: true
  # "runs" here correspond to validation evaluations (typically once per epoch)
  monitor: "val_loss"
  min_delta: 0.0
  patience: 5
  mode: "auto"
  restore_best_weights: false

# Optional: override the metric used to select the "best" checkpoint.
# Defaults to `early_stopping.monitor` if not set.
# checkpoint_monitor: "val_loss"
# checkpoint_mode: "auto"

